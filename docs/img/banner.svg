<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Sistema Administrativo — ERP para comercios, hecho con Laravel">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#D8CDB8" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#EFE7DA"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#E2A13B"/>

  <g transform="translate(80 96)">
    <text x="0" y="0" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15" letter-spacing="4.5" fill="#B87A22">LARAVEL 13 · PHP 8.3 · POSTGRES / MYSQL / SQLITE</text>

    <text x="0" y="78" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#1C2422">Sistema Administrativo</text>

    <text x="0" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#4A524F">Ventas, compras, stock multi-depósito, caja y reportes</text>
    <text x="0" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#4A524F">para comercios reales. No es un CRUD de demo.</text>

    <g transform="translate(0 208)" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#33403C">
      <g>
        <rect x="0" y="-18" width="118" height="30" rx="15" fill="#DCE3D3" stroke="#5B6E52"/>
        <text x="59" y="2" text-anchor="middle">31 modelos</text>
      </g>
      <g transform="translate(130 0)">
        <rect x="0" y="-18" width="150" height="30" rx="15" fill="#DCE3D3" stroke="#5B6E52"/>
        <text x="75" y="2" text-anchor="middle">33 migraciones</text>
      </g>
      <g transform="translate(292 0)">
        <rect x="0" y="-18" width="146" height="30" rx="15" fill="#DCE3D3" stroke="#5B6E52"/>
        <text x="73" y="2" text-anchor="middle">20 módulos</text>
      </g>
      <g transform="translate(450 0)">
        <rect x="0" y="-18" width="136" height="30" rx="15" fill="#F7F2E8" stroke="#D8CDB8"/>
        <text x="68" y="2" text-anchor="middle">API REST</text>
      </g>
      <g transform="translate(598 0)">
        <rect x="0" y="-18" width="188" height="30" rx="15" fill="#F7F2E8" stroke="#D8CDB8"/>
        <text x="94" y="2" text-anchor="middle">Roles y permisos</text>
      </g>
    </g>
  </g>

  <g transform="translate(1000 110)" opacity="0.92">
    <rect x="0" y="0" width="200" height="140" rx="6" fill="#F7F2E8" stroke="#33403C" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="26" rx="6" fill="#33403C"/>
    <rect x="0" y="20" width="200" height="6" fill="#33403C"/>
    <circle cx="14" cy="13" r="4" fill="#E2A13B"/>
    <circle cx="28" cy="13" r="4" fill="#EFE7DA"/>
    <line x1="0" y1="62" x2="200" y2="62" stroke="#D8CDB8" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="200" y2="90" stroke="#D8CDB8" stroke-width="1.5"/>
    <line x1="0" y1="118" x2="200" y2="118" stroke="#D8CDB8" stroke-width="1.5"/>
    <line x1="72" y1="26" x2="72" y2="140" stroke="#D8CDB8" stroke-width="1.5"/>
    <rect x="10" y="40" width="50" height="10" rx="2" fill="#5B6E52"/>
    <rect x="84" y="40" width="70" height="10" rx="2" fill="#D8CDB8"/>
    <rect x="10" y="70" width="44" height="10" rx="2" fill="#D8CDB8"/>
    <rect x="84" y="70" width="96" height="10" rx="2" fill="#E2A13B"/>
    <rect x="10" y="98" width="52" height="10" rx="2" fill="#D8CDB8"/>
    <rect x="84" y="98" width="58" height="10" rx="2" fill="#D8CDB8"/>
  </g>
</svg>
