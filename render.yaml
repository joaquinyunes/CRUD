# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# Uso:
#   1. Render > New > Blueprint > conectar este repositorio.
#   2. Render crea la base Postgres y el web service, y los enlaza solo.
#   3. Cargar APP_KEY a mano (es el único valor que Render no puede generar):
#        php artisan key:generate --show
#      y pegar el resultado completo, incluido el prefijo "base64:".
#
# El primer deploy corre las migraciones y, si DB_SEED_ON_BOOT=true, carga los
# datos de demostración (ver docker/entrypoint.sh).

databases:
  - name: crud-erp-db
    databaseName: crud_erp
    user: crud_erp
    plan: free

services:
  - type: web
    name: crud-erp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # --- Aplicación ---
      - key: APP_NAME
        value: Sistema Administrativo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # cargar a mano: php artisan key:generate --show
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: APP_FAKER_LOCALE
        value: es_AR

      # --- Base de datos (enlazada automáticamente a crud-erp-db) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: crud-erp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crud-erp-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: crud-erp-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: crud-erp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: crud-erp-db
          property: password

      # --- Sesión, caché y colas sobre la misma base ---
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE   # la demo se sirve solo por HTTPS
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- Demo: poblar el sistema en el primer arranque ---
      # Sólo siembra si la base está vacía. Poner en "false" si es una
      # instalación real de un cliente.
      - key: DB_SEED_ON_BOOT
        value: "true"

      # Poner en "true" si se quiere que la demo pública se reinicie sola en
      # cada arranque, descartando lo que hayan cargado los visitantes.
      - key: DB_SEED_ALWAYS
        value: "false"

      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log

      # --- Cola y tareas programadas ---
      # En el plan gratuito no hay servicios de fondo, así que el worker de
      # colas y el programador corren dentro del mismo contenedor web (ver
      # docker/entrypoint.sh). Para una instalación real conviene ponerlos en su
      # propio servicio —descomentar el bloque "worker" de abajo— y dejar esto
      # en "false", para que un reinicio del web no interrumpa un job a medias.
      - key: RUN_WORKERS
        value: "true"

      # --- Archivos subidos (adjuntos, PDFs, backups) ---
      # IMPORTANTE para una instalación real: el disco del contenedor es
      # efímero y se borra en cada deploy. Con "local", los adjuntos y los
      # backups desaparecen. Para producción hay que poner s3 y cargar las
      # cuatro variables de abajo (sirve cualquier S3: AWS, Cloudflare R2,
      # Backblaze B2, MinIO).
      - key: FILESYSTEM_DISK
        value: local
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false

# --- Worker dedicado (instalación real) ---
# Descomentar junto con RUN_WORKERS=false en el servicio web. Requiere un plan
# pago: Render no ofrece workers en el plan gratuito.
