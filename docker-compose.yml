# Entorno local completo, sin instalar PHP ni MongoDB en la máquina.
#
#   docker compose up --build
#   docker compose exec app php artisan db:seed --class=DemoSeeder
#
# La app queda en http://localhost:8080

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Sistema Administrativo"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:?Falta APP_KEY. Generala con: docker compose run --rm app php artisan key:generate --show}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: crud_erp
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DB_SEED_ON_BOOT: "true"
      LOG_CHANNEL: stderr
    depends_on:
      mongo:
        condition: service_healthy

  # Un solo nodo, pero como replica set: las ventas, el stock y la caja usan transacciones.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongodata:
