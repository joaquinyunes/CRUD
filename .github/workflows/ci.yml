name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, mongodb, gd, zip, bcmath, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: secret
        run: php artisan test

      # Que la suite pase no alcanza: las migraciones tienen que correr de punta
      # a punta en los tres motores, que es lo que hace un deploy real.
      - name: Verificar migraciones contra una base limpia
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: secret
        run: php artisan migrate:fresh --seed --force

  mongodb:
    name: Tests (MongoDB replica set)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Las ventas usan transacciones, que MongoDB solo da sobre un replica set
      # (aunque sea de un solo nodo). Un service container no permite pasarle
      # --replSet, por eso se levanta a mano.
      - name: Levantar MongoDB con replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 2
          done

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mongodb, gd, zip, bcmath, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # Mientras se porta el sistema por fases (PLAN-CRUD-MONGODB.md) corre lo que ya
      # vive en MongoDB. Cuando termine la fase 7 pasa a ser `php artisan test` entero.
      - name: Correr tests de MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: crud_erp_test
        run: php artisan test tests/Feature/Fase0Mongo tests/Feature/Fase1Mongo tests/Feature/Fase2Mongo tests/Feature/Fase3Mongo tests/Feature/VentaStockTest.php tests/Feature/CajaTest.php

  estatico:
    name: Análisis estático (PHPStan nivel 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, gd, zip, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  estilo:
    name: Estilo de código (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  seguridad:
    name: Dependencias con vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit

      # Solo las dependencias que llegan al servidor. Las de construcción
      # (Tailwind y su cadena de globbing) se ejecutan en el build y no se
      # despliegan: incluirlas obligaría a migrar a Tailwind 4 para tapar un
      # fallo que solo se dispara con patrones que uno mismo escribe.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
