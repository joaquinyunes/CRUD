name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (MongoDB replica set)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Las ventas usan transacciones, que MongoDB solo da sobre un replica set
      # (aunque sea de un solo nodo). Un service container no permite pasarle
      # --replSet, por eso se levanta a mano.
      - name: Levantar MongoDB con replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 2
          done

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, gd, zip, bcmath, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: crud_erp_test
        run: php artisan test

  estatico:
    name: Análisis estático (PHPStan nivel 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, gd, zip, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  estilo:
    name: Estilo de código (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  seguridad:
    name: Dependencias con vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit

      # Solo las dependencias que llegan al servidor. Las de construcción
      # (Tailwind y su cadena de globbing) se ejecutan en el build y no se
      # despliegan: incluirlas obligaría a migrar a Tailwind 4 para tapar un
      # fallo que solo se dispara con patrones que uno mismo escribe.
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Busca formas de claves reales en los archivos versionados. Imprime solo
      # archivo, línea y tipo: nunca el valor. Si falla, rotar la clave antes de borrarla.
      - name: Buscar patrones de secretos
        run: |
          fallo=0
          buscar() {
            r=$(git grep -InP -e "$2" -- . ':!*package-lock.json' ':!*composer.lock' | cut -d: -f1,2 | sed "s|\$| [$1]|") || true
            if [ -n "$r" ]; then echo "$r"; fallo=1; fi
          }
          buscar 'clave privada' '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
          buscar 'AWS AKIA' 'AKIA[0-9A-Z]{16}'
          buscar 'token de GitHub' 'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{30,}'
          buscar 'Stripe sk_live' 'sk_live_[A-Za-z0-9]{10,}'
          buscar 'Mercado Pago APP_USR' 'APP_USR-[0-9A-Za-z-]{30,}'
          buscar 'JWT eyJ' 'eyJ[A-Za-z0-9_-]{15,}\.eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}'
          buscar 'Supabase sb_secret' 'sb_secret_[A-Za-z0-9_-]{20,}'
          buscar 'Google AIza' 'AIza[0-9A-Za-z_-]{35}'
          buscar 'Slack' 'xox[abprs]-[0-9A-Za-z-]{10,}'
          buscar 'URL de base con clave' '(mongodb(\+srv)?|postgres(ql)?)://[^:/@\s"'"'"'<$]+:(?!(?i:password|clave|contrase|xxx|tu_|your))[^@\s"'"'"'<$\{]{6,}@[A-Za-z0-9.-]+\.(mongodb\.net|neon\.tech|supabase\.(co|com)|render\.com|rds\.amazonaws\.com)'
          exit $fallo
